name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
        x402-version:
          - 2.19.0
          - 2.20.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Select x402 compatibility line
        run: npm install --no-save --package-lock=false @x402/core@${{ matrix.x402-version }} @x402/extensions@${{ matrix.x402-version }}
      - run: npm run check
        env:
          X402_COMPAT_VERSION: ${{ matrix.x402-version }}
